<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a1f;--mu:#667;--ac:#2e7d32;--bd:#dde3da;--r:#c62828;--o:#ef8f00;--g:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#141a15;--card:#1e271f;--tx:#e8efe8;--mu:#9aa89b;--ac:#66bb6a;--bd:#33403a;--r:#ef5350;--o:#ffb74d;--g:#66bb6a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Naskh Arabic",Tahoma,sans-serif;padding-bottom:70px}
header{background:var(--ac);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px;width:100%}
header select{width:auto;padding:4px}main{padding:10px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:13px;color:var(--mu);display:block}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 2px;font:inherit;font-size:13px}nav button.on{color:var(--ac);font-weight:700;border-top:3px solid var(--ac)}
button.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:start}
.s{display:inline-block;border-radius:10px;padding:1px 8px;color:#fff;font-size:12px}.low{background:var(--r)}.ok{background:var(--g)}.hi{background:var(--o)}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}.row>*{flex:1}.chips{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:4px 12px;font:inherit}.chips .on{background:var(--ac);color:#fff}
small{color:var(--mu)}.fd{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style></head><body>

function adj(f,tier){ // quality tier: 2=book mean, 1=-1SD, 3=+1SD (in the direction of better quality)
 const s=tier-2,g=Object.assign({},f);if(!s||f.ndf==null||f.cp==null||f.ndf_sd==null||f.cp_sd==null)return g;
 const dC=s*f.cp_sd,dN=-s*f.ndf_sd;g.cp=Math.max(0,f.cp+dC);g.ndf=Math.max(0,f.ndf+dN);
 if(f.adf_sd!=null)g.adf=Math.max(0,f.adf-s*f.adf_sd);if(f.lig_sd!=null)g.lig=Math.max(0,f.lig-s*f.lig_sd);
 const dn=(f.ivndf||45)/100,dcp=1-(f.rup||30)/100*(1-(f.drup||75)/100); // Eq. 3-8 partial terms
 g.de=Math.max(0,f.de+0.042*dn*dN+0.0565*dcp*dC+0.0423*0.9*(-dN-dC));return g}
function simplex(cons,cost,n){const m=cons.length,T=cons.map(k=>{const r=k.a.map(v=>v/k.b);return r}),c=cost.slice(),info=[],B=[],rhs=cons.map(()=>1);
 const add=(i,v,cc,tag)=>{T.forEach(r=>r.push(0));T[i][T[i].length-1]=v;c.push(cc);info.push({i,tag});return c.length-1};
 cons.forEach((k,i)=>{if(k.t=='ge'){B[i]=add(i,1,k.pen,'d');add(i,-1,0,'s')}else if(k.t=='le'){B[i]=add(i,1,0,'s');add(i,-1,k.pen,'e')}else if(k.t=='eq'){B[i]=add(i,1,k.pen,'d');add(i,-1,k.pen,'e')}else B[i]=add(i,1,0,'s')});
 const N=c.length;let it=0;
 while(it++<8000){let j=-1,bj=-1e-7;for(let q=0;q<N;q++){let rc=c[q];for(let i=0;i<m;i++)rc-=c[B[i]]*T[i][q];if(rc<bj){bj=rc;j=q;if(it>2000)break}}
  if(j<0)break;let r=-1,best=1e18;for(let i=0;i<m;i++)if(T[i][j]>1e-7){const q=rhs[i]/T[i][j];if(q<best-1e-12||(Math.abs(q-best)<=1e-12&&B[i]<B[r])){best=q;r=i}}
  if(r<0)break;const pv=T[r][j];for(let q=0;q<N;q++)T[r][q]/=pv;rhs[r]/=pv;
  for(let i=0;i<m;i++)if(i!=r&&Math.abs(T[i][j])>1e-12){const f=T[i][j];for(let q=0;q<N;q++)T[i][q]-=f*T[r][q];rhs[i]-=f*rhs[r]}B[r]=j}
 const x=Array(N).fill(0);B.forEach((b,i)=>x[b]=rhs[i]);return{x:x.slice(0,n),dev:cons.map((k,i)=>{let d=0;info.forEach((f,q)=>{if(f.i==i&&f.tag=='d')d+=x[n+q]});return d})}}
